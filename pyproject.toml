[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vadexplore"
version = "0.1.0"
description = "Voice activity detection exploration on LibriSpeech-style clips"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "soundfile==0.14.0",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "matplotlib==3.11.1",
    "pyyaml==6.0.3",
    "tqdm==4.70.0",
    "webrtcvad==2.0.10",
    "pandas==3.0.5",
    "sounddevice==0.5.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "scipy==1.17.1"]

[tool.setuptools.packages.find]
include = ["vadexplore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

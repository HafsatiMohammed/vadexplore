# Base training config; augmentation on.
# Command-line flags override these.

name: null                 # required, either here or via --name
seed: 0
device: auto               # cuda | mps | cpu | auto
progress: auto             # auto | true | false; auto follows the TTY
out_root: runs

data:
  split: splits/split.json
  feature_stats: splits/feature_stats.json
  label: bridged           # literal | bridged
  bridge_gap_s: 0.10       # the committed elbow, see my report §2.1
  highpass_hz: 80.0        # null disables
  highpass_order: 2
  cache_features: true
  limit_clips: null        # null = all; caps clips per partition

model:
  core: bigru              # bigru | causal_attn
  d_model: 128
  conv_channels: [32, 64, 64]
  causal_frontend: true
  dropout: 0.1
  # bigru
  gru_hidden: 64
  gru_layers: 2
  causal: false
  # causal_attn
  attn_layers: 2
  attn_heads: 4
  attn_ff_ratio: 2
  attn_dropout: 0.1
  lookahead_frames: 0
  past_window_frames: null # per layer; null = unbounded, see my report §7

augment:
  enabled: true
  rir_dir: path/to/rirs
  musan_dir: path/to/musan
  rir_split: train         # train | hard
  musan_split: train       # train | test
  preserve_level: true
  reverb_prob: 0.5
  noise_prob: 0.8
  noise_rir_prob: 0.5      # probability the interferer also gets a room
  snr_db_range: [0.0, 20.0]
  seed: 0

loss:
  weighting: inverse_freq  # none | inverse_freq

optim:
  batch_size: 8
  epochs: 30
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  scheduler: cosine        # cosine | plateau | none
  min_lr: 0.00001

eval:
  select_on: frr_at_fa        # frr_at_fa | eer | auc | val_loss
  target_fa_per_hour: 100.0   # placeholder, set from a product requirement
  min_fa_frames: 3            # ignore false-positive runs under 30 ms
  n_thresholds: 101
  early_stopping_patience: 8  # null disables
